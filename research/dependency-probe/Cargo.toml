[package]
name = "cjr-dependency-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "parse"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2"] }
tar = { version = "=0.4.46" }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
sha2 = { version = "=0.11.1" }
tempfile = { version = "=3.27.0" }
semver = { version = "=1.0.28" }
thiserror = { version = "=2.0.21" }
tracing = { version = "=0.1.44" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
proptest = "=1.12.0"
