[package]
name = "cjr"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
description = "Run Cangjie binaries with their exact official runtime"

[dependencies]
backon = { version = "=1.6.0", default-features = false, features = ["std-blocking-sleep"] }
walkdir = "=2.5.0"
hex = "=0.4.3"
clap = { version = "=4.6.7", features = ["derive"] }
object = { version = "=0.40.0", default-features = false, features = ["read", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "parse"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
zip = { version = "=9.5.0", default-features = false, features = ["deflate-flate2"] }
tar = "=0.4.46"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
scopeguard = "=1.2.0"
rustix = { version = "=1.1.6", features = ["fs", "process", "termios"] }
signal-hook = "=0.4.6"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
mockito = "=1.7.2"
proptest = "=1.12.0"

[profile.release]
lto = "thin"
strip = true
